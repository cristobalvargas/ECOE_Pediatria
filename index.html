    ['D', 'Síndrome hemolítico urémico típico por E. coli productora de toxina Shiga', 1.5, true],
    ['D', 'Tríada: anemia hemolítica microangiopática, trombocitopenia y falla renal aguda', 1],
    ['M', 'Hospitalizar en un centro con diálisis pediátrica disponible', 1],
    ['M', 'Balance hídrico estricto, peso diario y control de PA', 1],
    ['M', 'Volumen: cristaloides isotónicos si no hay sobrecarga, restricción si hay oligoanuria con sobrecarga', 1],
    ['M', 'No antibióticos, antidiarreicos ni antiespasmódicos', 1, true],
    ['M', 'Evitar AINE y nefrotóxicos', 0.5],
    ['M', 'Transfusión de glóbulos rojos si Hb menor de 7 g/dl o inestabilidad', 1],
    ['M', 'Plaquetas solo si hay sangrado activo o procedimiento invasivo', 0.5],
    ['M', 'Manejo de HTA, hiperkalemia y criterios de diálisis', 1],
    ['M', 'Coprocultivo o PCR para STEC', 0.5],
    ['M', 'Seguimiento nefrológico a largo plazo', 0.5]
  ],
  perlas: 'Principal causa de falla renal aguda en niños. Agente: E. coli productora de toxina Shiga (O157:H7 y otros), por carne mal cocida, lácteos no pasteurizados, agua o contacto persona a persona.\nLos antibióticos pueden aumentar la liberación de toxina.\nLa expansión de volumen precoz (antes de la oligoanuria) se asocia a menor necesidad de diálisis.\nCriterios de diálisis: anuria prolongada, sobrecarga de volumen refractaria, hiperkalemia, acidosis o uremia sintomática.\nComplicaciones extrarrenales: neurológicas (convulsiones), pancreatitis, colitis grave, miocardiopatía.\nSHU atípico (sin diarrea, recurrente, familiar): estudio del complemento, eculizumab.\n\nContraindicaciones:\nAINE: falla renal. Transfusión de plaquetas: no profiláctica (puede empeorar la microangiopatía).',
  notas: 'El apunte solo decía "manejo de soporte", sin contenido. Este checklist se construyó desde conocimiento general y no desde el documento. La notificación del SHU depende de la normativa vigente, que no verifiqué.'
});


</script>

<script>
// ================== APP ==================
const STORE_KEY = 'ecoe_ped_progress_v1';
const CUSTOM_KEY = 'ecoe_ped_custom_cases_v1';
const THEME_KEY = 'ecoe_ped_theme';
const STATION_SECONDS = 300;

function safeGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function safeSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

let progress = safeGet(STORE_KEY, {});
let customCases = safeGet(CUSTOM_KEY, []);
function allCases() {
  const map = new Map();
  CASES_DATA.forEach(c => map.set(c.id, c));
  customCases.forEach(c => map.set(c.id, c));
  return [...map.values()].sort((a, b) => (a.especialidad || '').localeCompare(b.especialidad || '') || (a.numeroEstacion || 0) - (b.numeroEstacion || 0));
}
function getCase(id) { return allCases().find(c => c.id === id); }

const state = {
  view: 'dashboard',
  mode: 'dirigido',
  filterEsp: 'Todas',
  filterEstado: 'Todos',
  search: '',
  pool: 'todos',
  current: null,
  blind: false,
  blindNumber: 0,
  timerId: null,
  remaining: STATION_SECONDS,
  startTs: 0,
  elapsed: 0,
  beeped: false,
  checks: {},
  saved: false,
  forceWeak: false,
  notes: ''
};

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmt(s) { return esc(s).replace(/\n/g, '<br>'); }
function mmss(sec) { sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }
function icons() { if (window.lucide) lucide.createIcons(); }
function totalPts(c) { return c.pautaCotejo.reduce((a, i) => a + Number(i.peso || 0), 0); }
function round1(n) { return Math.round(n * 10) / 10; }

function statusOf(id) {
  const p = progress[id];
  if (!p || !p.attempts || !p.attempts.length) return p && p.flag ? 'debil' : 'pendiente';
  if (p.flag || p.last < 70) return 'debil';
  if (p.last > 85) return 'dominado';
  return 'progreso';
}
const STATUS_META = {
  dominado: { label: 'Dominado', cls: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300' },
  progreso: { label: 'En progreso', cls: 'bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-300' },
  debil: { label: 'Débil', cls: 'bg-rose-100 text-rose-800 dark:bg-rose-900/50 dark:text-rose-300' },
  pendiente: { label: 'Pendiente', cls: 'bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300' }
};
const ESP_COLORS = {
  'Neonatología': 'bg-sky-100 text-sky-800 dark:bg-sky-900/50 dark:text-sky-300',
  'Pediatría': 'bg-violet-100 text-violet-800 dark:bg-violet-900/50 dark:text-violet-300'
};
function badge(text, cls) { return `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold ${cls}">${esc(text)}</span>`; }

// ---------- Tema ----------
function applyTheme() {
  const t = safeGet(THEME_KEY, null);
  const dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', dark);
}
function toggleTheme() {
  const dark = !document.documentElement.classList.contains('dark');
  safeSet(THEME_KEY, dark ? 'dark' : 'light');
  applyTheme(); render();
}

// ---------- Audio ----------
let audioCtx = null;
function initAudio() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} }
function beep(freq = 880, dur = 0.25, times = 1) {
  if (!audioCtx) return;
  for (let i = 0; i < times; i++) {
    const t0 = audioCtx.currentTime + i * (dur + 0.12);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
}

// ---------- Navegación ----------
function render() {
  const app = document.getElementById('app');
  if (state.view === 'dashboard') app.innerHTML = renderDashboard();
  else if (state.view === 'station') app.innerHTML = renderStation();
  else if (state.view === 'pauta') app.innerHTML = renderPauta();
  icons();
}

function startStation(id, blind) {
  initAudio();
  stopTimer();
  state.current = id;
  state.blind = !!blind;
  if (blind) state.blindNumber = Math.floor(Math.random() * 90) + 10;
  state.remaining = STATION_SECONDS;
  state.startTs = Date.now();
  state.elapsed = 0;
  state.beeped = false;
  state.checks = {};
  state.saved = false;
  state.forceWeak = false;
  state.notes = '';
  state.view = 'station';
  render();
  window.scrollTo(0, 0);
  state.timerId = setInterval(tick, 250);
}
function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }
function tick() {
  const el = (Date.now() - state.startTs) / 1000;
  state.remaining = Math.max(0, STATION_SECONDS - el);
  state.elapsed = Math.min(STATION_SECONDS, el);
  if (!state.beeped && state.remaining <= 60) { state.beeped = true; beep(880, 0.25, 2); }
  if (state.remaining <= 0) { beep(440, 0.6, 1); goToPauta(); return; }
  updateTimerUI();
}
function updateTimerUI() {
  const t = document.getElementById('timer');
  const bar = document.getElementById('topbar');
  if (!t || !bar) return;
  t.textContent = mmss(state.remaining);
  let cls = 'bg-teal-600 dark:bg-teal-700';
  if (state.remaining <= 60) cls = 'bg-amber-500 dark:bg-amber-600';
  bar.className = 'sticky top-0 z-30 text-white shadow-md transition-colors ' + cls;
  const pb = document.getElementById('timebar');
  if (pb) pb.style.width = (100 * state.remaining / STATION_SECONDS) + '%';
}
function goToPauta() {
  if (state.view !== 'station') return;
  const ta = document.getElementById('notes');
  if (ta) state.notes = ta.value;
  stopTimer();
  state.elapsed = Math.min(STATION_SECONDS, (Date.now() - state.startTs) / 1000);
  state.view = 'pauta';
  render();
  window.scrollTo(0, 0);
}
function backToDashboard() {
  stopTimer();
  state.view = 'dashboard';
  state.current = null;
  render();
  window.scrollTo(0, 0);
}

function poolCases(pool) {
  const cs = allCases();
  if (pool === 'debiles') return cs.filter(c => statusOf(c.id) === 'debil');
  if (pool === 'pendientes') return cs.filter(c => statusOf(c.id) === 'pendiente');
  return cs;
}
function randomStation(pool) {
  pool = pool || state.pool;
  let cs = poolCases(pool);
  if (state.current && cs.length > 1) cs = cs.filter(c => c.id !== state.current);
  if (!cs.length) { toast(pool === 'debiles' ? 'No tienes estaciones débiles todavía.' : 'No quedan estaciones pendientes.'); return; }
  const c = cs[Math.floor(Math.random() * cs.length)];
  startStation(c.id, true);
}

// ---------- Dashboard ----------
function renderHeader(extra = '') {
  return `
  <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-teal-600 text-white grid place-items-center"><i data-lucide="baby" class="w-5 h-5"></i></div>
        <div>
          <h1 class="font-extrabold text-lg leading-tight">ECOE Pediatría y Neonatología</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Estaciones habladas de 5 minutos</p>
        </div>
      </div>
      <div class="flex items-center gap-2">${extra}
        <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800" title="Modo claro u oscuro"><i data-lucide="${document.documentElement.classList.contains('dark') ? 'sun' : 'moon'}" class="w-5 h-5"></i></button>
      </div>
    </div>
  </header>`;
}

function renderDashboard() {
  const cs = allCases();
  const counts = { total: cs.length, dominado: 0, progreso: 0, debil: 0, pendiente: 0 };
  cs.forEach(c => counts[statusOf(c.id)]++);
  const card = (label, n, icon, cls) => `
    <div class="rounded-2xl p-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
      <div class="flex items-center justify-between"><span class="text-sm text-slate-500 dark:text-slate-400">${label}</span><i data-lucide="${icon}" class="w-5 h-5 ${cls}"></i></div>
      <div class="text-3xl font-extrabold mt-1">${n}</div>
    </div>`;
  const tabBtn = (m, label, icon) => `<button onclick="state.mode='${m}';render()" class="flex-1 flex items-center justify-center gap-2 px-4 py-3 rounded-xl font-semibold transition ${state.mode === m ? 'bg-teal-600 text-white shadow' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}"><i data-lucide="${icon}" class="w-4 h-4"></i>${label}</button>`;
  return `
  ${renderHeader()}
  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
    <section class="grid grid-cols-2 md:grid-cols-5 gap-3">
      ${card('Total estaciones', counts.total, 'layers', 'text-slate-400')}
      ${card('Dominadas (&gt;85%)', counts.dominado, 'trophy', 'text-emerald-500')}
      ${card('En progreso (70 a 85%)', counts.progreso, 'trending-up', 'text-amber-500')}
      ${card('Débiles', counts.debil, 'flag', 'text-rose-500')}
      ${card('Pendientes', counts.pendiente, 'circle-dashed', 'text-slate-400')}
    </section>

    <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-2 flex gap-2">
      ${tabBtn('dirigido', 'Estudio dirigido', 'target')}
      ${tabBtn('aleatorio', 'Simulación a ciegas', 'shuffle')}
    </section>

    ${state.mode === 'dirigido' ? renderDirigido(cs) : renderAleatorio()}

    ${renderDataTools()}

    <p class="text-xs text-center text-slate-400 pb-6">Atajos: <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800">R</kbd> estación al azar · <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800">Espacio</kbd> o <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800">Enter</kbd> ir a pauta durante la estación</p>
  </main>`;
}

function renderDirigido(cs) {
  const esps = ['Todas', ...new Set(cs.map(c => c.especialidad))];
  const q = state.search.trim().toLowerCase();
  let list = cs.filter(c => state.filterEsp === 'Todas' || c.especialidad === state.filterEsp);
  if (state.filterEstado === 'Débiles') list = list.filter(c => statusOf(c.id) === 'debil');
  if (state.filterEstado === 'Pendientes') list = list.filter(c => statusOf(c.id) === 'pendiente');
  if (q) list = list.filter(c => (c.titulo + ' ' + c.especialidad + ' ' + (c.instruccionPuerta?.vineta || '')).toLowerCase().includes(q));
  const sel = (val, opts, handler) => `<select onchange="${handler}" class="rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm">${opts.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  const rows = list.map(c => {
    const st = statusOf(c.id), p = progress[c.id] || {};
    const hasMissed = p.missed && p.missed.length && p.attempts && p.attempts.length;
    return `
    <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4 flex flex-col sm:flex-row sm:items-center gap-3">
      <div class="flex-1 min-w-0">
        <div class="flex flex-wrap items-center gap-2 mb-1">
          ${badge(c.especialidad, ESP_COLORS[c.especialidad] || 'bg-slate-200 text-slate-700')}
          ${badge(STATUS_META[st].label, STATUS_META[st].cls)}
          ${c.tipoPauta === 'oficial' ? badge('Pauta oficial', 'bg-teal-100 text-teal-800 dark:bg-teal-900/50 dark:text-teal-300') : badge('Checklist construido', 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400')}
        </div>
        <h3 class="font-semibold truncate">${esc(c.titulo)}</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400">${p.attempts && p.attempts.length ? `Último: <b>${p.last}%</b> · Mejor: ${p.best}% · Intentos: ${p.attempts.length}` : 'Sin intentos'}</p>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        ${hasMissed ? `<button onclick="showMissed('${c.id}')" class="text-xs px-3 py-2 rounded-lg border border-rose-300 text-rose-700 dark:border-rose-800 dark:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950 flex items-center gap-1"><i data-lucide="list-x" class="w-4 h-4"></i>Qué me faltó</button>` : ''}
        <button onclick="toggleFlag('${c.id}')" title="Marcar para reforzar" class="p-2 rounded-lg border ${p.flag ? 'border-rose-400 bg-rose-50 text-rose-600 dark:bg-rose-950 dark:border-rose-800' : 'border-slate-300 dark:border-slate-700 text-slate-400'}"><i data-lucide="flag" class="w-4 h-4"></i></button>
        <button onclick="startStation('${c.id}', false)" class="px-4 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold flex items-center gap-1"><i data-lucide="play" class="w-4 h-4"></i>Iniciar</button>
      </div>
    </div>`;
  }).join('');
  return `
  <section class="space-y-3">
    <div class="flex flex-wrap gap-2 items-center">
      ${sel(state.filterEsp, esps, "state.filterEsp=this.value;render()")}
      ${sel(state.filterEstado, ['Todos', 'Débiles', 'Pendientes'], "state.filterEstado=this.value;render()")}
      <div class="relative flex-1 min-w-[180px]">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input id="searchbox" value="${esc(state.search)}" oninput="state.search=this.value;rerenderList()" placeholder="Buscar estación" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 pl-9 pr-3 py-2 text-sm">
      </div>
      <span class="text-sm text-slate-500">${list.length} estaciones</span>
    </div>
    <div class="space-y-2">${rows || '<p class="text-center text-slate-500 py-8">No hay estaciones con estos filtros.</p>'}</div>
  </section>`;
}
function rerenderList() {
  const pos = document.getElementById('searchbox')?.selectionStart;
  render();
  const sb = document.getElementById('searchbox');
  if (sb) { sb.focus(); try { sb.setSelectionRange(pos, pos); } catch (e) {} }
}

function renderAleatorio() {
  const opt = (v, label, n) => `<label class="flex items-center gap-3 p-3 rounded-xl border cursor-pointer ${state.pool === v ? 'border-teal-500 bg-teal-50 dark:bg-teal-950/40' : 'border-slate-200 dark:border-slate-800'}"><input type="radio" name="pool" ${state.pool === v ? 'checked' : ''} onchange="state.pool='${v}';render()" class="accent-teal-600"><span class="flex-1 font-medium">${label}</span><span class="text-sm text-slate-500">${n}</span></label>`;
  return `
  <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 space-y-5">
    <div class="flex items-start gap-3">
      <i data-lucide="eye-off" class="w-6 h-6 text-teal-600 mt-0.5"></i>
      <div><h2 class="font-bold text-lg">Simulación a ciegas</h2><p class="text-sm text-slate-500 dark:text-slate-400">Se ocultan el diagnóstico y la especialidad hasta la pauta. Enfréntala como el día del examen.</p></div>
    </div>
    <div class="grid sm:grid-cols-3 gap-3">
      ${opt('todos', 'Todos los casos', poolCases('todos').length)}
      ${opt('debiles', 'Solo débiles', poolCases('debiles').length)}
      ${opt('pendientes', 'Solo no realizados', poolCases('pendientes').length)}
    </div>
    <button onclick="randomStation()" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold flex items-center justify-center gap-2 text-lg"><i data-lucide="dices" class="w-5 h-5"></i>Iniciar estación al azar</button>
  </section>`;
}

function renderDataTools() {
  return `
  <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl">
    <details>
      <summary class="p-4 flex items-center justify-between font-semibold"><span class="flex items-center gap-2"><i data-lucide="database" class="w-4 h-4"></i>Gestión de datos</span><i data-lucide="chevron-down" class="w-4 h-4 chev"></i></summary>
      <div class="px-4 pb-4 grid md:grid-cols-2 gap-4">
        <div class="space-y-2">
          <h4 class="font-semibold text-sm">Progreso</h4>
          <div class="flex flex-wrap gap-2">
            <button onclick="exportProgress()" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-sm flex items-center gap-1"><i data-lucide="download" class="w-4 h-4"></i>Exportar .json</button>
            <label class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-sm flex items-center gap-1 cursor-pointer"><i data-lucide="upload" class="w-4 h-4"></i>Importar .json<input type="file" accept=".json,application/json" class="hidden" onchange="importProgress(this)"></label>
            <button onclick="resetProgress()" class="px-3 py-2 rounded-lg border border-rose-300 text-rose-600 dark:border-rose-800 text-sm flex items-center gap-1"><i data-lucide="trash-2" class="w-4 h-4"></i>Borrar progreso</button>
          </div>
          <p class="text-xs text-slate-500">El progreso se guarda en este navegador. Exporta para pasarlo a otro dispositivo.</p>
        </div>
        <div class="space-y-2">
          <h4 class="font-semibold text-sm">Agregar casos (JSON)</h4>
          <textarea id="caseInput" rows="4" placeholder='Pega un objeto o un arreglo de casos con el esquema de CASES_DATA' class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 p-2 text-xs font-mono"></textarea>
          <div class="flex flex-wrap gap-2">
            <button onclick="loadCasesFromText()" class="px-3 py-2 rounded-lg bg-teal-600 text-white text-sm flex items-center gap-1"><i data-lucide="plus" class="w-4 h-4"></i>Cargar casos</button>
            <label class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-sm flex items-center gap-1 cursor-pointer"><i data-lucide="file-json" class="w-4 h-4"></i>Desde archivo<input type="file" accept=".json,application/json" class="hidden" onchange="loadCasesFromFile(this)"></label>
            ${customCases.length ? `<button onclick="clearCustom()" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-sm">Quitar ${customCases.length} casos agregados</button>` : ''}
          </div>
        </div>
      </div>
    </details>
  </section>`;
}

// ---------- Estación ----------
function renderStation() {
  const c = getCase(state.current);
  const ip = c.instruccionPuerta || {};
  const sv = ip.signosVitales || {};
  const svKeys = Object.keys(sv).filter(k => sv[k]);
  const p = progress[c.id] || {};
  const missed = (p.missed || []).map(id => c.pautaCotejo.find(i => i.idItem === id)).filter(Boolean);
  const title = state.blind ? `Estación aleatoria #${state.blindNumber}` : esc(c.titulo);
  const sub = state.blind ? 'Especialidad oculta' : esc(c.especialidad);
  const info = c.infoDesbloqueable || {};
  const acc = (label, icon, text) => text ? `
    <details class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
      <summary class="p-4 flex items-center justify-between font-semibold"><span class="flex items-center gap-2"><i data-lucide="${icon}" class="w-4 h-4 text-teal-600"></i>${label}</span><i data-lucide="chevron-down" class="w-4 h-4 chev"></i></summary>
      <div class="px-4 pb-4 text-sm leading-relaxed text-slate-700 dark:text-slate-300">${fmt(text)}</div>
    </details>` : '';
  return `
  <div id="topbar" class="sticky top-0 z-30 text-white shadow-md bg-teal-600 dark:bg-teal-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
      <button onclick="if(confirm('¿Salir de la estación sin evaluar?')) backToDashboard()" class="p-2 rounded-lg hover:bg-white/15" title="Salir"><i data-lucide="x" class="w-5 h-5"></i></button>
      <div class="flex-1 min-w-0">
        <div class="font-bold truncate">${title}</div>
        <div class="text-xs opacity-90">${sub}</div>
      </div>
      <div class="flex items-center gap-2"><i data-lucide="timer" class="w-5 h-5"></i><span id="timer" class="font-mono text-3xl font-extrabold tabular-nums">${mmss(state.remaining)}</span></div>
      <button onclick="goToPauta()" class="ml-2 px-4 py-2 rounded-lg bg-white text-slate-900 font-bold flex items-center gap-1 hover:bg-slate-100"><span class="hidden sm:inline">Siguiente / Ir a pauta</span><span class="sm:hidden">Pauta</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button>
    </div>
    <div class="h-1 bg-white/20"><div id="timebar" class="h-1 bg-white transition-all" style="width:100%"></div></div>
  </div>
  <main class="max-w-6xl mx-auto px-4 py-6 grid lg:grid-cols-5 gap-5">
    <section class="lg:col-span-3 space-y-4">
      <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 shadow-sm">
        <div class="flex items-center gap-2 text-sm text-teal-700 dark:text-teal-400 font-semibold mb-3"><i data-lucide="door-open" class="w-4 h-4"></i>Puerta de estación · ${esc(c.escenario || '')}</div>
        <p class="text-[1.05rem] leading-relaxed">${fmt(ip.vineta)}</p>
      </div>
      <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5">
        <div class="flex items-center gap-2 font-semibold mb-3"><i data-lucide="activity" class="w-4 h-4 text-rose-500"></i>Signos vitales</div>
        ${svKeys.length ? `<div class="grid grid-cols-2 sm:grid-cols-5 gap-2">${svKeys.map(k => `<div class="rounded-lg bg-slate-50 dark:bg-slate-800 p-2 text-center"><div class="text-xs text-slate-500">${esc(k)}</div><div class="font-bold">${esc(sv[k])}</div></div>`).join('')}</div>` : '<p class="text-sm text-slate-500">No informados en el caso.</p>'}
      </div>
      <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5">
        <div class="flex items-center gap-2 font-semibold mb-3"><i data-lucide="list-checks" class="w-4 h-4 text-teal-600"></i>Tareas</div>
        <ol class="list-decimal pl-5 space-y-1.5">${(ip.tareas || []).map(t => `<li>${fmt(t)}</li>`).join('')}</ol>
      </div>
    </section>
    <section class="lg:col-span-2 space-y-3">
      ${acc('Ver datos de anamnesis', 'message-circle', info.anamnesis)}
      ${acc('Ver examen físico', 'stethoscope', info.examenFisico)}
      ${acc('Ver exámenes complementarios', 'flask-conical', info.complementarios)}
      ${!info.anamnesis && !info.examenFisico && !info.complementarios ? '<p class="text-sm text-slate-500 px-1">Esta estación no tiene información a demanda. Todo está en la puerta.</p>' : ''}
      ${missed.length ? `
      <details class="rounded-xl border border-amber-300 dark:border-amber-800 bg-amber-50 dark:bg-amber-950/40">
        <summary class="p-4 flex items-center justify-between font-semibold text-amber-800 dark:text-amber-300"><span class="flex items-center gap-2"><i data-lucide="history" class="w-4 h-4"></i>Recordatorio: omitidos en tu intento anterior</span><i data-lucide="chevron-down" class="w-4 h-4 chev"></i></summary>
        <ul class="px-6 pb-4 list-disc text-sm space-y-1">${missed.map(i => `<li>${esc(i.descripcion)}</li>`).join('')}</ul>
      </details>` : ''}
      <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
        <label class="text-sm font-semibold flex items-center gap-2 mb-2"><i data-lucide="pencil" class="w-4 h-4"></i>Borrador rápido (opcional)</label>
        <textarea id="notes" rows="5" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-2 text-sm" placeholder="Apuntes, no se evalúan">${esc(state.notes)}</textarea>
      </div>
    </section>
  </main>`;
}

// ---------- Pauta ----------
function scoreNow(c) {
  let got = 0;
  c.pautaCotejo.forEach(i => { if (state.checks[i.idItem]) got += Number(i.peso || 0); });
  const tot = totalPts(c);
  return { got: round1(got), tot: round1(tot), pct: tot ? Math.round(100 * got / tot) : 0 };
}
function renderPauta() {
  const c = getCase(state.current);
  const groups = {};
  c.pautaCotejo.forEach(i => { (groups[i.categoria] = groups[i.categoria] || []).push(i); });
  const s = scoreNow(c);
  const groupHtml = Object.entries(groups).map(([cat, items]) => `
    <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
      <div class="px-4 py-2.5 bg-slate-100 dark:bg-slate-800 font-semibold text-sm flex justify-between"><span>${esc(cat)}</span><span class="text-slate-500">${round1(items.reduce((a, i) => a + Number(i.peso || 0), 0))} pts</span></div>
      <div class="divide-y divide-slate-100 dark:divide-slate-800">
        ${items.map(i => `
        <label class="flex items-start gap-3 p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50">
          <input type="checkbox" class="chk mt-0.5" ${state.checks[i.idItem] ? 'checked' : ''} onchange="toggleCheck('${i.idItem}', this.checked)">
          <span class="flex-1 text-[0.95rem] leading-snug">${fmt(i.descripcion)} ${i.critico ? '<span class="ml-1 text-xs font-bold text-rose-600 dark:text-rose-400 align-middle">CRÍTICO</span>' : ''}</span>
          <span class="text-sm font-semibold text-slate-500 tabular-nums">${i.peso}</span>
        </label>`).join('')}
      </div>
    </div>`).join('');
  return `
  ${renderHeader(`<button onclick="backToDashboard()" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-sm flex items-center gap-1"><i data-lucide="home" class="w-4 h-4"></i>Inicio</button>`)}
  <main class="max-w-4xl mx-auto px-4 py-6 space-y-5">
    <section class="rounded-2xl p-5 bg-gradient-to-br from-teal-600 to-teal-800 text-white shadow">
      <div class="flex flex-wrap items-center gap-2 text-sm opacity-90 mb-1"><i data-lucide="eye" class="w-4 h-4"></i>${state.blind ? `Estación aleatoria #${state.blindNumber} revelada` : 'Pauta de cotejo'}</div>
      <h2 class="text-2xl font-extrabold">${esc(c.titulo)}</h2>
      <div class="flex flex-wrap gap-2 mt-2 text-sm">
        <span class="px-2 py-0.5 rounded-full bg-white/20">${esc(c.especialidad)}</span>
        <span class="px-2 py-0.5 rounded-full bg-white/20 flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i>Tiempo empleado ${mmss(state.elapsed)} min</span>
        <span class="px-2 py-0.5 rounded-full bg-white/20">${c.tipoPauta === 'oficial' ? 'Pauta oficial del documento' : 'Checklist construido desde el apunte (no oficial)'}</span>
      </div>
    </section>

    <section class="sticky top-[65px] z-10 rounded-2xl bg-white/95 dark:bg-slate-900/95 backdrop-blur border border-slate-200 dark:border-slate-800 p-4 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div><span id="scoreTxt" class="text-2xl font-extrabold tabular-nums">${s.got} / ${s.tot}</span> <span class="text-slate-500">pts</span> <span id="pctTxt" class="ml-2 text-2xl font-extrabold ${s.pct < 70 ? 'text-rose-600' : s.pct > 85 ? 'text-emerald-600' : 'text-amber-600'}">${s.pct}%</span></div>
        <div class="flex gap-2">
          <button onclick="markAll(true)" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-sm flex items-center gap-1"><i data-lucide="check-check" class="w-4 h-4"></i>Marcar todo</button>
          <button onclick="markAll(false)" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 text-sm flex items-center gap-1"><i data-lucide="square" class="w-4 h-4"></i>Desmarcar todo</button>
        </div>
      </div>
      <div class="h-2.5 rounded-full bg-slate-200 dark:bg-slate-800 mt-3 overflow-hidden"><div id="pctBar" class="h-full rounded-full transition-all ${s.pct < 70 ? 'bg-rose-500' : s.pct > 85 ? 'bg-emerald-500' : 'bg-amber-500'}" style="width:${s.pct}%"></div></div>
    </section>

    <section class="space-y-4">${groupHtml}</section>

    <section id="missedBox">${renderMissedBox(c)}</section>

    <section class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5">
      <h3 class="font-bold flex items-center gap-2 mb-2"><i data-lucide="gem" class="w-4 h-4 text-teal-600"></i>Perlas clínicas</h3>
      <div class="text-sm leading-relaxed text-slate-700 dark:text-slate-300">${fmt(c.perlasClinicas)}</div>
    </section>

    ${c.notasActualizacion ? `
    <section class="rounded-2xl bg-sky-50 dark:bg-sky-950/40 border border-sky-200 dark:border-sky-900 p-5">
      <h3 class="font-bold flex items-center gap-2 mb-2 text-sky-800 dark:text-sky-300"><i data-lucide="refresh-cw" class="w-4 h-4"></i>Correcciones y actualizaciones respecto al documento</h3>
      <div class="text-sm leading-relaxed text-sky-900 dark:text-sky-200">${fmt(c.notasActualizacion)}</div>
    </section>` : ''}

    ${state.notes.trim() ? `<section class="rounded-2xl border border-slate-200 dark:border-slate-800 p-4 text-sm"><b>Tu borrador:</b><br>${fmt(state.notes)}</section>` : ''}

    <section class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 space-y-3">
      <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" class="chk" ${state.forceWeak ? 'checked' : ''} onchange="state.forceWeak=this.checked"><span>Marcar como débil para repasar (bajo 70% se marca solo)</span></label>
      <div class="flex flex-col sm:flex-row gap-3">
        <button onclick="saveAttempt(true)" class="flex-1 px-5 py-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold flex items-center justify-center gap-2"><i data-lucide="save" class="w-5 h-5"></i>Guardar intento y finalizar</button>
        <button onclick="saveAttempt(false); randomStation()" class="flex-1 px-5 py-3 rounded-xl border-2 border-teal-600 text-teal-700 dark:text-teal-400 font-bold flex items-center justify-center gap-2"><i data-lucide="shuffle" class="w-5 h-5"></i>Guardar y pasar a otra al azar</button>
      </div>
      <button onclick="if(confirm('¿Salir sin guardar este intento?')) backToDashboard()" class="text-sm text-slate-500 underline">Salir sin guardar</button>
    </section>
  </main>`;
}
function renderMissedBox(c) {
  const missed = c.pautaCotejo.filter(i => !state.checks[i.idItem]);
  if (!missed.length) return `<div class="rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900 p-5 text-emerald-800 dark:text-emerald-300 font-semibold flex items-center gap-2"><i data-lucide="party-popper" class="w-5 h-5"></i>Sin omisiones en esta sesión</div>`;
  return `
  <div class="rounded-2xl bg-rose-50 dark:bg-rose-950/40 border-2 border-rose-300 dark:border-rose-900 p-5">
    <h3 class="font-bold text-rose-800 dark:text-rose-300 flex items-center gap-2 mb-2"><i data-lucide="alert-triangle" class="w-5 h-5"></i>Puntos omitidos en esta sesión (${missed.length})</h3>
    <ul class="list-disc pl-6 space-y-1 text-sm text-rose-900 dark:text-rose-200">${missed.map(i => `<li>${esc(i.descripcion)} <span class="opacity-70">(${i.peso} pts${i.critico ? ', crítico' : ''})</span></li>`).join('')}</ul>
  </div>`;
}
function toggleCheck(id, v) { state.checks[id] = v; updateScoreUI(); }
function markAll(v) { const c = getCase(state.current); c.pautaCotejo.forEach(i => state.checks[i.idItem] = v); render(); }
function updateScoreUI() {
  const c = getCase(state.current), s = scoreNow(c);
  const color = s.pct < 70 ? 'rose' : s.pct > 85 ? 'emerald' : 'amber';
  document.getElementById('scoreTxt').textContent = `${s.got} / ${s.tot}`;
  const pt = document.getElementById('pctTxt'); pt.textContent = s.pct + '%'; pt.className = `ml-2 text-2xl font-extrabold text-${color}-600`;
  const pb = document.getElementById('pctBar'); pb.style.width = s.pct + '%'; pb.className = `h-full rounded-full transition-all bg-${color}-500`;
  document.getElementById('missedBox').innerHTML = renderMissedBox(c);
  icons();
}
function saveAttempt(finish) {
  const c = getCase(state.current);
  if (!state.saved) {
    const s = scoreNow(c);
    const p = progress[c.id] || { attempts: [], flag: false };
    p.attempts = p.attempts || [];
    p.attempts.push({ date: new Date().toISOString(), pct: s.pct, time: Math.round(state.elapsed) });
    p.last = s.pct;
    p.best = Math.max(p.best || 0, s.pct);
    p.lastTime = Math.round(state.elapsed);
    p.missed = c.pautaCotejo.filter(i => !state.checks[i.idItem]).map(i => i.idItem);
    if (state.forceWeak) p.flag = true;
    else if (s.pct >= 70 && p.flag && p.autoFlag) { p.flag = false; }
    p.autoFlag = false;
    progress[c.id] = p;
    safeSet(STORE_KEY, progress);
    state.saved = true;
  }
  if (finish) { toast('Intento guardado'); backToDashboard(); }
}

// ---------- Acciones varias ----------
function toggleFlag(id) {
  const p = progress[id] || { attempts: [] };
  p.flag = !p.flag; p.autoFlag = false;
  progress[id] = p; safeSet(STORE_KEY, progress); render();
}
function showMissed(id) {
  const c = getCase(id), p = progress[id] || {};
  const items = (p.missed || []).map(mid => c.pautaCotejo.find(i => i.idItem === mid)).filter(Boolean);
  openModal(`Lo que te faltó la última vez`, `<p class="text-sm text-slate-500 mb-3">${esc(c.titulo)} · último ${p.last}%</p><ul class="list-disc pl-5 space-y-1.5">${items.map(i => `<li>${esc(i.descripcion)}</li>`).join('')}</ul>`);
}
function openModal(title, body) {
  document.getElementById('modal-root').innerHTML = `
  <div class="fixed inset-0 z-50 bg-black/50 grid place-items-center p-4" onclick="if(event.target===this) closeModal()">
    <div class="w-full max-w-lg max-h-[85vh] overflow-auto scroll-thin rounded-2xl bg-white dark:bg-slate-900 p-5 shadow-xl">
      <div class="flex items-center justify-between mb-3"><h3 class="font-bold text-lg">${esc(title)}</h3><button onclick="closeModal()" class="p-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      ${body}
    </div>
  </div>`;
  icons();
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
function toast(msg) {
  const d = document.createElement('div');
  d.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-lg text-sm font-medium';
  d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2200);
}
function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportProgress() { download(`progreso_ecoe_ped_${new Date().toISOString().slice(0, 10)}.json`, { version: 1, progress, customCases }); }
function readFile(input, cb) { const f = input.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { cb(JSON.parse(r.result)); } catch (e) { toast('JSON inválido'); } input.value = ''; }; r.readAsText(f); }
function importProgress(input) {
  readFile(input, data => {
    if (!data || typeof data !== 'object') return toast('Archivo no reconocido');
    progress = data.progress || data;
    if (Array.isArray(data.customCases)) { customCases = data.customCases; safeSet(CUSTOM_KEY, customCases); }
    safeSet(STORE_KEY, progress); toast('Progreso importado'); render();
  });
}
function resetProgress() { if (confirm('¿Borrar todo el progreso guardado? No se puede deshacer.')) { progress = {}; safeSet(STORE_KEY, progress); render(); } }
function validCase(c) { return c && c.id && c.titulo && c.instruccionPuerta && Array.isArray(c.pautaCotejo) && c.pautaCotejo.length; }
function addCases(data) {
  const arr = Array.isArray(data) ? data : [data];
  const ok = arr.filter(validCase);
  if (!ok.length) return toast('No encontré casos válidos (requieren id, titulo, instruccionPuerta y pautaCotejo)');
  ok.forEach(c => { const i = customCases.findIndex(x => x.id === c.id); if (i >= 0) customCases[i] = c; else customCases.push(c); });
  safeSet(CUSTOM_KEY, customCases); toast(`${ok.length} casos cargados`); render();
}
function loadCasesFromText() { const t = document.getElementById('caseInput').value.trim(); if (!t) return; try { addCases(JSON.parse(t)); } catch (e) { toast('JSON inválido'); } }
function loadCasesFromFile(input) { readFile(input, addCases); }
function clearCustom() { if (confirm('¿Quitar los casos agregados manualmente?')) { customCases = []; safeSet(CUSTOM_KEY, customCases); render(); } }

// ---------- Teclado ----------
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'textarea' || tag === 'input' || tag === 'select';
  if (state.view === 'station' && !typing && (e.code === 'Space' || e.key === 'Enter')) { e.preventDefault(); goToPauta(); }
  else if (state.view === 'dashboard' && !typing && (e.key === 'r' || e.key === 'R')) { e.preventDefault(); randomStation(); }
  else if (e.key === 'Escape') closeModal();
});

applyTheme();
render();
</script>
</body>
</html>
